[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kelvin367-harmonization"
version = "0.1.0"
description = "Daily MODIS/VIIRS hot-spot harmonization policies"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
# strategy 1 (weekly chain): country masks and the GFED5 evaluation
weekly = ["shapely>=2.0", "h5py"]

[project.scripts]
kelvin367-harmonize = "kelvin367_harmonization.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
